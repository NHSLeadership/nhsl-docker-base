# The PHP-FPM image under test behind the published nhsl-caddy image, run the
# way Kubernetes does, with the image's own PHP settings (laravel profile).
# compose.caddy-moodle.yml layers Moodle's override on top. Used by the
# build-php workflow through run.sh.
#
#   PHPFPM_IMAGE=nhsl-ubuntu-phpv2:test docker compose -f tests/php/compose.caddy.yml up -d
name: php-test-caddy
services:
  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/nhsleadership/nhsl-caddy:latest}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SITE_NAME: php-test
      NHSLA_PROFILE: ${NHSLA_PROFILE:-laravel}
      NHSLA_ROOT: ${NHSLA_ROOT:-/app-shared/public}
    tmpfs:
      - /tmp
    volumes:
      - app-shared:/app-shared

  phpfpm:
    image: ${PHPFPM_IMAGE:?set PHPFPM_IMAGE to the image under test}
    read_only: true
    network_mode: "service:caddy"
    environment:
      AWS_HOST_ENVIRONMENT: "true"
      S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
    volumes:
      - ../app/:/app/public/:ro
      - app-shared:/app-shared
      - fpm-run:/run
      - fpm-tmp:/tmp
      - fpm-nhsla:/nhsla/etc

volumes:
  app-shared:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=256m,uid=1000,gid=1000" }
  fpm-run:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64m,uid=1000,gid=1000" }
  fpm-tmp:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64m,uid=1000,gid=1000" }
  fpm-nhsla:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64m,uid=1000,gid=1000" }
