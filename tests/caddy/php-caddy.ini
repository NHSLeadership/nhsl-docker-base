; Redundant once the published nhsl-ubuntu-phpv2 images set cgi.fix_pathinfo=1
; themselves (tests/php checks the image). This test stack pulls the published
; image, so keep this until that has shipped, then remove it and its mount in
; compose.yml.
; nhsl-caddy needs PHP to derive the script from SCRIPT_FILENAME + PATH_INFO.
; The base php.ini sets cgi.fix_pathinfo=0, which makes php-fpm reject every
; request with PATH_INFO from Caddy ("Access denied", 403). Safe with Caddy:
; it only proxies paths whose .php part is an existing file.
cgi.fix_pathinfo = 1
