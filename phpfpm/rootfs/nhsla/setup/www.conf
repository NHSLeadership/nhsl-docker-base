[www]
user = nhsla
group = nhsla
listen = 127.0.0.1:9000
listen.backlog = 511
listen.owner = nhsla
listen.group = nhsla
listen.mode = 0660
listen.allowed_clients = 127.0.0.1
pm = static
pm.max_children = 10
pm.max_requests = 1000
; Wall-clock kill for workers stuck on blocking I/O. max_execution_time only
; bounds engine execution time, so a worker hung on a socket/DB can sit forever
; and shrink the effective pool; this reclaims it. Kept above max_execution_time
; (30s) so the app-level limit fires first for normal overruns.
request_terminate_timeout = 60s
pm.status_path = /status
; Status/ping get their own listener and workers so the exporter and
; healthchecks still answer when every worker in the main pool is busy.
pm.status_listen = 127.0.0.1:9001
ping.path = /healthz-php
ping.response = OK
access.log = /dev/stdout
catch_workers_output = yes
; Pass worker stderr through untouched, so a JSON log line from the app stays
; valid JSON for Vector/VictoriaLogs instead of being wrapped in
; "[pool www] child N said into stderr: ..."
decorate_workers_output = no
clear_env = no
; Only ever run .php files, whatever SCRIPT_FILENAME the web server sends,
; so an uploaded evil.jpg (or .phar) can't be run as PHP. php-fpm's own
; default also allows .phar. This is also what makes cgi.fix_pathinfo=1 safe
; where a chart enables it (Moodle behind Caddy): see php.ini.
security.limit_extensions = .php
