; PHP CLI overrides, loaded from /etc/php/<version>/cli/conf.d/99-nhsla-cli.ini.
;
; PHP-FPM uses our own php.ini (variables_order = "EGPCS"), but the CLI
; (cron via supercronic, wp-cli, artisan, etc.) uses Ubuntu's stock php.ini,
; which sets "GPCS" and leaves $_ENV empty. Match FPM so apps that read
; $_ENV behave the same in CLI runs. All other CLI defaults are unchanged.
variables_order = "EGPCS"
